name: Daily affiliate blogs

on:
  schedule:
    # 10:00 UTC = 6:00 AM New York (EDT). Change to "0 11 * * *" after clocks go back in November.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated repo names to run now (blank = today's rotation)"
        required: false
        default: ""
      dry_run:
        description: "Generate posts but don't push"
        type: boolean
        default: false

concurrency:
  group: daily-blogs
  cancel-in-progress: false

jobs:
  blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "anthropic>=0.40"

      - name: Generate and publish posts
        run: python blog_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          SITES_PER_DAY: "2"
          POSTS_PER_SITE: "2"
          MIN_WORDS: "1200"
          FORCE_SITES: ${{ inputs.sites }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
